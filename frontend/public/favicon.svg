<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <linearGradient id="voxaMonoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <linearGradient id="voxaAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Modern Luxury Obsidian Rounded Tile -->
  <rect width="100" height="100" rx="22" fill="#000000" />
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Voxa Geometric Dual-Prism 'V' Monogram -->
  <g filter="url(#glow)">
    <polygon points="20,18 42,18 50,42 28,42" fill="url(#voxaMonoGrad)" />
    <polygon points="58,18 80,18 72,42 50,42" fill="#52525b" />
    <polygon points="28,42 50,42 50,84 38,84" fill="#ffffff" />
    <polygon points="50,42 72,42 62,84 50,84" fill="url(#voxaAccentGrad)" />
    <circle cx="50" cy="42" r="3.5" fill="#000000" />
  </g>
</svg>